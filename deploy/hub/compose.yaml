name: jenna-car-hub

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-jenna_car}
      MYSQL_USER: ${DB_USER:-jenna_car_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Configura DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  snapshot:
    image: ysml17/jenna_car:datos-20261116
    command: [sh, -c, 'cp /backup/snapshot.tar.gz /transfer/snapshot.tar.gz']
    volumes:
      - transfer:/transfer

  restore:
    image: ysml17/jenna_car:tagname-backend
    user: root
    entrypoint: [python, /tools/restore.py]
    env_file: .env.production
    environment:
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - ./restore.py:/tools/restore.py:ro
      - transfer:/transfer
      - profile_uploads:/restore/profile
      - repair_uploads:/restore/repairs
    depends_on:
      db:
        condition: service_healthy
      snapshot:
        condition: service_completed_successfully

  import:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME:-jenna_car}
      MYSQL_USER: ${DB_USER:-jenna_car_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD}
    command: [sh, /tools/import.sh]
    volumes:
      - ./import.sh:/tools/import.sh:ro
      - transfer:/transfer
    depends_on:
      restore:
        condition: service_completed_successfully

  backend:
    image: ysml17/jenna_car:tagname-backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DATABASE_URL: ""
      MYSQL_URL: ""
      FLASK_DEBUG: "false"
      TRUST_RESET_PROXY_IP: "1"  # Private backend behind nginx, which overwrites X-Real-IP.
    volumes:
      - profile_uploads:/app/backend/uploads
      - repair_uploads:/app/backend/app/uploads
    depends_on:
      db:
        condition: service_healthy
      import:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/services', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    image: ysml17/jenna_car:tagname
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  profile_uploads:
  repair_uploads:
  transfer:
