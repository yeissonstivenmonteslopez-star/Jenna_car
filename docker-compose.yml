services:
  db:
    image: mysql:8.0
    container_name: jenna_car_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-jenna_car}
      MYSQL_USER: ${DB_USER:-jenna_car_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-jenna_car_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jenna_car_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      FLASK_DEBUG: "false"
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-jenna_car}
      DB_USER: ${DB_USER:-jenna_car_user}
      DB_PASSWORD: ${DB_PASSWORD:-jenna_car_pass}
      DATABASE_URL: mysql+pymysql://${DB_USER:-jenna_car_user}:${DB_PASSWORD:-jenna_car_pass}@db:3306/${DB_NAME:-jenna_car}?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:-jenna-car-dev-secret-2026-strong-key-123}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "5000:5000"

  frontend:
    image: node:20-alpine
    container_name: jenna_car_frontend
    working_dir: /app
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}

volumes:
  mysql_data:
